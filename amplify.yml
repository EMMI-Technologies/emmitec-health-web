version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - node -v
        - npm ci --no-audit --no-fund
    build:
      commands:
        # VITE_API_BASE_URL vem das variáveis de ambiente do app no Amplify
        - echo "VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api-backoffice.emmitec.health/v1}"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
